<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1565C0"/>
      <stop offset="1" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Morse wave motif across the top -->
  <g fill="#FFC107" opacity="0.9">
    <circle cx="90" cy="90" r="14"/>
    <rect x="124" y="76" width="70" height="28" rx="14"/>
    <circle cx="224" cy="90" r="14"/>
    <circle cx="268" cy="90" r="14"/>
    <rect x="304" y="76" width="70" height="28" rx="14"/>
    <circle cx="404" cy="90" r="14"/>
  </g>

  <text x="64" y="240" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="68" font-weight="700" fill="#FFFFFF">Morse Translator Pro</text>
  <text x="66" y="300" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="34" fill="#BBDEFB">Translate &#183; Transmit &#183; Decode &#8212; Offline</text>

  <!-- Feature chips -->
  <g font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="26" fill="#0D47A1">
    <rect x="66" y="372" width="200" height="56" rx="28" fill="#FFFFFF"/>
    <text x="96" y="408">Flashlight</text>
    <rect x="286" y="372" width="160" height="56" rx="28" fill="#FFFFFF"/>
    <text x="316" y="408">Audio</text>
    <rect x="466" y="372" width="210" height="56" rx="28" fill="#FFFFFF"/>
    <text x="496" y="408">Camera decode</text>
  </g>

  <!-- Large glyph, bottom-right, clear of the title -->
  <g fill="#FFFFFF" opacity="0.95" transform="translate(735,400) scale(0.9)">
    <circle cx="0" cy="0" r="34"/>
    <rect x="64" y="-34" width="150" height="68" rx="34" fill="#FFC107"/>
    <circle cx="258" cy="0" r="34"/>
  </g>
</svg>
